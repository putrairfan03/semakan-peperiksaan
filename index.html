<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semakan Keputusan Peperiksaan | Marvel Edition</title>
  
  <!-- Pustaka Barcode Scanner & Confetti Pop -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --marvel-red: #e23636;
      --marvel-dark-red: #990000;
      --marvel-orange: #f97316;
      --marvel-gold: #facc15;
      --dark-bg: #0f1117;
      --card-bg: #1a1d26;
      --ink: #f8fafc;
      --mut: #94a3b8;
      --line: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--dark-bg);
      background-image: radial-gradient(circle at 50% 0%, rgba(226, 54, 54, 0.18), transparent 70%);
      color: var(--ink);
      min-height: 100vh;
    }

    /* HEADER TEMA MARVEL */
    header {
      background: linear-gradient(135deg, var(--marvel-dark-red), #b91c1c, var(--marvel-orange));
      color: #fff;
      padding: 24px 16px;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 20px rgba(226, 54, 54, 0.35);
      border-bottom: 2px solid var(--marvel-gold);
    }
    .marvel-badge {
      display: inline-block;
      background: #fff;
      color: #e23636;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 2px;
      padding: 2px 10px;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transform: skew(-8deg);
      margin-bottom: 8px;
    }
    header h1 {
      margin: 4px 0 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    header p { margin: 6px 0 0; font-size: 13px; opacity: .9; }

    main { max-width: 760px; margin: 0 auto; padding: 16px; }

    /* KAD GAYA KOMIK MODEN */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--marvel-red), var(--marvel-orange), var(--marvel-gold));
    }

    /* RUANG KAMERA SCANNER DENGAN ANIMASI LASER */
    #reader-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 2px solid var(--marvel-orange);
    }
    #reader { width: 100%; min-height: 240px; background: #000; }
    #reader video { width: 100% !important; height: auto !important; object-fit: cover; }
    .scan-laser {
      position: absolute;
      left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, #ef4444, #f97316, #ef4444, transparent);
      box-shadow: 0 0 14px #f97316, 0 0 8px #ef4444;
      animation: laserMove 2.2s infinite ease-in-out;
      pointer-events: none;
      z-index: 10;
    }
    @keyframes laserMove {
      0% { top: 5%; opacity: 0.3; }
      50% { top: 90%; opacity: 1; }
      100% { top: 5%; opacity: 0.3; }
    }

    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; align-items: center; }

    /* BUTANG BERKILAU */
    .btn {
      border: 1px solid var(--line);
      background: #242938;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      text-decoration: none;
      display: inline-block;
      font-weight: 600;
      transition: all .2s ease;
    }
    .btn.primary {
      background: linear-gradient(135deg, var(--marvel-red), var(--marvel-orange));
      border: none;
      color: #fff;
      box-shadow: 0 4px 14px rgba(226, 54, 54, 0.4);
    }
    .btn.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(249, 115, 22, 0.5);
    }

    input[type=text], select {
      padding: 11px 14px;
      background: #11141d;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 15px;
      color: #fff;
    }
    input[type=text] { flex: 1; min-width: 170px; }
    input[type=text]:focus { outline: none; border-color: var(--marvel-orange); }

    .msg { margin-top: 12px; padding: 12px 14px; border-radius: 10px; font-size: 14px; line-height: 1.45; }
    .msg.err { background: rgba(185, 28, 28, 0.2); color: #fca5a5; border: 1px solid #b91c1c; }
    .msg.info { background: rgba(249, 115, 22, 0.15); color: #fdba74; border: 1px solid #ea580c; }
    .hint { font-size: 12px; color: var(--mut); margin-top: 8px; }
    [hidden] { display: none !important; }

    /* TAB NAVIGASI */
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab {
      flex: 1; padding: 12px; border: 0; border-radius: 10px;
      background: #242938; color: var(--mut); font-weight: 700;
      cursor: pointer; font-size: 14px; transition: .2s;
    }
    .tab.on {
      background: linear-gradient(135deg, var(--marvel-red), var(--marvel-orange));
      color: #fff;
      box-shadow: 0 2px 10px rgba(226, 54, 54, 0.35);
    }

    /* KAD DASHBOARD PELAJAR */
    .name { font-size: 22px; font-weight: 800; margin: 0; color: #fff; letter-spacing: 0.5px; }
    .ic { color: var(--mut); font-size: 14px; margin: 2px 0 10px; }
    .chip { display: inline-block; padding: 5px 14px; border-radius: 99px; font-size: 13px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
    .stat {
      background: #11141d;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .stat b { display: block; font-size: 22px; color: var(--marvel-gold); }
    .stat span { font-size: 12px; color: var(--mut); }

    .sub { margin: 14px 0; }
    .sub .top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; font-weight: 600; }
    .track { position: relative; height: 12px; background: #262c3d; border-radius: 99px; overflow: hidden; }
    .fill { height: 100%; border-radius: 99px; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
    .mark { position: absolute; top: 0; bottom: 0; width: 3px; background: #fff; box-shadow: 0 0 6px #fff; }
    .legend { font-size: 12px; color: var(--mut); margin-top: 8px; }
    .comment {
      background: #11141d;
      border-left: 4px solid var(--marvel-orange);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 16px;
    }

    /* SLIP PEPERIKSAAN CETAKAN */
    .slip { border: 2px solid #111; padding: 20px; background: #fff; color: #111; border-radius: 8px; }
    .slip h2 { text-align: center; margin: 0 0 14px; font-size: 18px; letter-spacing: .5px; }
    .slip table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 14px; }
    .slip td, .slip th { border: 1px solid #999; padding: 7px 9px; text-align: left; }
    .slip th { background: #eee; }
    .slip .k { width: 38%; background: #f6f6f6; font-weight: 600; }
    .pdf { width: 100%; height: 520px; border: 1px solid var(--line); border-radius: 10px; margin-top: 14px; }

    @media print {
      body * { visibility: hidden; }
      #slip, #slip * { visibility: visible; }
      #slip { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <div class="marvel-badge">MARVEL</div>
  <h1>SEMAKAN KEPUTUSAN PEPERIKSAAN</h1>
  <p>Imbas barcode kad pelajar untuk mengaktifkan rekod</p>
</header>

<main>
  <!-- ===== BAHAGIAN PENGIMBAS ===== -->
  <section id="scanCard" class="card">
    <div id="reader-container">
      <div class="scan-laser" id="laser"></div>
      <div id="reader"></div>
    </div>
    <div id="fileReader" hidden></div>
    <div id="camMsg" class="msg" hidden></div>

    <div class="row">
      <button id="btnStart" class="btn primary">📷 Mula Imbas (Kamera Belakang)</button>
      <button id="btnStop" class="btn" hidden>⏹ Henti</button>
      <select id="camSelect" hidden></select>
      <label class="btn">📁 Muat naik gambar
        <input type="file" id="fileIn" accept="image/*" capture="environment" hidden>
      </label>
    </div>

    <div class="row">
      <input type="text" id="manual" placeholder="Taip No. IC / imbas scanner USB" autocomplete="off">
      <button id="btnManual" class="btn primary">Semak</button>
    </div>
    <div class="hint">⚡ Halakan barcode melintang di bawah garisan laser. Pastikan pencahayaan cukup.</div>
    <div id="loading" class="msg info" hidden>Sedang memuat data dari pangkalan data...</div>
  </section>

  <!-- ===== BAHAGIAN KEPUTUSAN ===== -->
  <section id="result" hidden>
    <div class="row" style="margin:0 0 14px">
      <button id="btnAgain" class="btn primary">🔄 Imbas Pelajar Lain</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="dash">Dashboard Prestasi</button>
      <button class="tab" data-tab="slipTab">Slip Peperiksaan</button>
    </div>

    <div id="dash" class="card"></div>

    <div id="slipTab" hidden>
      <div class="card">
        <div id="slip" class="slip"></div>
        <div class="row">
          <button class="btn primary" onclick="window.print()">🖨 Cetak Slip</button>
          <a id="lnkView" class="btn" target="_blank" rel="noopener">Buka PDF</a>
          <a id="lnkDl" class="btn" target="_blank" rel="noopener">⬇ Muat Turun PDF</a>
        </div>
        <div id="pdfBox"></div>
      </div>
    </div>
  </section>
</main>

<script>
  var API_URL = 'https://script.google.com/macros/s/AKfycbz8DqnK0w03nqC341Q_sAbAyXzAP0r9vBuoLRZ8Ib4mis2FrXKLvcv7Xx065aRytWD3/exec';

  var $ = function (id) { return document.getElementById(id); };
  var GP = { 'A+': 0, 'A': 1, 'A-': 2, 'B+': 3, 'B': 4, 'C+': 5, 'C': 6, 'D': 7, 'E': 8, 'F': 9 };
  
  // Warna status bertema Marvel
  var STATUS_COLOR = {
    'Cemerlang': 'linear-gradient(135deg, #e23636, #f97316)',
    'Kepujian': 'linear-gradient(135deg, #f97316, #facc15)',
    'Memuaskan': 'linear-gradient(135deg, #0284c7, #2563eb)',
    'Mencapai Tahap Minimum': 'linear-gradient(135deg, #ea580c, #b45309)',
    'Perlu Bimbingan': 'linear-gradient(135deg, #7f1d1d, #991b1b)'
  };
  
  var html5QrCode = null, fileQr = null, running = false, busy = false;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function gradeGradient(p) {
    return p <= 1 ? 'linear-gradient(90deg, #f59e0b, #e23636)' : 
           p <= 3 ? 'linear-gradient(90deg, #f97316, #facc15)' : 
           p <= 5 ? 'linear-gradient(90deg, #3b82f6, #06b6d4)' : 
           'linear-gradient(90deg, #64748b, #475467)';
  }

  function popHeroConfetti() {
    if (typeof confetti === 'function') {
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 },
        colors: ['#e23636', '#f97316', '#facc15', '#ffffff']
      });
    }
  }

  function beep() {
    try {
      var c = new (window.AudioContext || window.webkitAudioContext)();
      var o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 880;
      o.connect(c.destination); o.start();
      setTimeout(function () { o.stop(); c.close(); }, 140);
    } catch (e) {}
  }

  function showCamMsg(html, type) {
    var m = $('camMsg'); m.className = 'msg ' + (type || 'err'); m.innerHTML = html; m.hidden = false;
  }

  /* ================= PENGIMBAS KAMERA ================= */
  async function startScan(targetDeviceId) {
    if (typeof Html5Qrcode === 'undefined') {
      showCamMsg('Pustaka pengimbas belum sedia. Sila muat semula halaman.', 'err');
      return;
    }
    $('camMsg').hidden = true;
    if (running) await stopScan();

    try {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode('reader', {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.QR_CODE,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8
          ],
          verbose: false
        });
      }

      var devices = await Html5Qrcode.getCameras();
      var chosenId = targetDeviceId;

      if (devices && devices.length > 0) {
        var sel = $('camSelect');
        sel.innerHTML = devices.map(function (c, i) {
          return '<option value="' + esc(c.id) + '">' + esc(c.label || ('Kamera ' + (i + 1))) + '</option>';
        }).join('');
        sel.hidden = devices.length < 2;

        if (!chosenId) {
          var backCam = devices.find(function (d) {
            return /back|rear|environment|belakang/i.test(d.label);
          });
          chosenId = backCam ? backCam.id : devices[devices.length - 1].id;
        }
        sel.value = chosenId;
      }

      var cameraConfig = chosenId ? { deviceId: { exact: chosenId } } : { facingMode: "environment" };

      var config = {
        fps: 15,
        qrbox: function (w, h) {
          return { width: Math.floor(Math.min(w * 0.85, 360)), height: Math.floor(Math.min(h * 0.45, 180)) };
        }
      };

      await html5QrCode.start(cameraConfig, config, onScan, function () {});
      running = true;
      $('btnStart').hidden = true;
      $('btnStop').hidden = false;
      $('laser').hidden = false;
    } catch (err) {
      running = false;
      $('laser').hidden = true;
      showCamMsg('<b>Kamera gagal dihidupkan:</b> ' + esc(err.message || err), 'err');
    }
  }

  async function stopScan() {
    if (html5QrCode && running) {
      try { await html5QrCode.stop(); } catch (e) {}
    }
    running = false;
    $('btnStart').hidden = false;
    $('btnStop').hidden = true;
    $('laser').hidden = true;
  }

  function onScan(decodedText) {
    if (busy) return;
    busy = true;
    beep();
    stopScan().then(function () { lookup(decodedText); });
  }

  /* ================= AMBIL DATA DARI APPS SCRIPT ================= */
  async function lookup(code) {
    busy = true;
    $('loading').hidden = false; $('camMsg').hidden = true;
    
    try {
      var targetUrl = API_URL + '?code=' + encodeURIComponent(code);
      var response = await fetch(targetUrl);
      var res = await response.json();
      
      $('loading').hidden = true;
      busy = false;

      if (!res || !res.ok) {
        showCamMsg(esc((res && res.message) || 'Rekod pelajar tidak dijumpai.'), 'err');
        return;
      }
      render(res.student);
    } catch (err) {
      $('loading').hidden = true;
      busy = false;
      showCamMsg('Ralat sambungan: ' + esc(err.message || err), 'err');
    }
  }

  /* ================= PAPARAN KEPUTUSAN ================= */
  function render(s) {
    var bgChip = STATUS_COLOR[s.status] || 'linear-gradient(135deg, #475467, #334155)';

    var bars = s.subjects.map(function (x) {
      var p = GP[x.grade.toUpperCase()];
      var known = p !== undefined;
      var w = known ? Math.max(8, ((9 - p) / 9) * 100) : 0;
      var avg = s.classAvg[x.name];
      var mark = avg == null ? '' : '<div class="mark" style="left:' + (((9 - avg) / 9) * 100) + '%"></div>';
      return '<div class="sub"><div class="top"><span>' + esc(x.name) + '</span><b style="color:var(--marvel-gold)">' + esc(x.grade) + '</b></div>' +
             '<div class="track"><div class="fill" style="width:' + w + '%;background:' + (known ? gradeGradient(p) : '#64748b') + '"></div>' + mark + '</div></div>';
    }).join('');

    $('dash').innerHTML =
      '<p class="name">' + esc(s.nama) + '</p>' +
      '<p class="ic">No. Kad Pengenalan: ' + esc(s.ic) + '</p>' +
      '<span class="chip" style="background:' + bgChip + '">' + esc(s.status) + '</span>' +
      '<div class="stats">' +
        '<div class="stat"><b>' + esc(s.kedudukan) + ' / ' + esc(s.total) + '</b><span>Kedudukan</span></div>' +
        '<div class="stat"><b>' + esc(s.purata) + '</b><span>Gred Purata</span></div>' +
        '<div class="stat"><b>' + esc(s.subjects.length) + '</b><span>Subjek</span></div>' +
      '</div>' +
      bars +
      '<div class="legend">Bar Berwarna = Prestasi Pelajar. Garis Putih = Purata Kelas.</div>' +
      '<div class="comment"><b>Ulasan Guru:</b> ' + esc(s.ulasan) + '</div>';

    var rows = s.subjects.map(function (x) {
      return '<tr><td>' + esc(x.name) + '</td><td><b>' + esc(x.grade) + '</b></td></tr>';
    }).join('');

    $('slip').innerHTML =
      '<h2>SLIP KEPUTUSAN PEPERIKSAAN</h2>' +
      '<table>' +
        '<tr><td class="k">Nama</td><td>' + esc(s.nama) + '</td></tr>' +
        '<tr><td class="k">No. Kad Pengenalan</td><td>' + esc(s.ic) + '</td></tr>' +
        '<tr><td class="k">Kedudukan</td><td>' + esc(s.kedudukan) + ' daripada ' + esc(s.total) + ' pelajar</td></tr>' +
        '<tr><td class="k">Gred Purata</td><td>' + esc(s.purata) + '</td></tr>' +
        '<tr><td class="k">Status</td><td>' + esc(s.status) + '</td></tr>' +
      '</table>' +
      '<table><tr><th>Subjek</th><th>Gred</th></tr>' + rows + '</table>' +
      '<p style="font-size:13px"><b>Ulasan:</b> ' + esc(s.ulasan) + '</p>' +
      '<p style="font-size:11px;color:#666;margin:8px 0 0">Dicetak pada ' + new Date().toLocaleString('ms-MY') + '</p>';

    if (s.slip) {
      $('lnkView').href = s.slip.viewUrl; $('lnkView').hidden = false;
      $('lnkDl').href = s.slip.downloadUrl; $('lnkDl').hidden = false;
      $('pdfBox').innerHTML = '<iframe class="pdf" src="' + esc(s.slip.previewUrl) + '"></iframe>';
    } else {
      $('lnkView').hidden = true; $('lnkDl').hidden = true;
      $('pdfBox').innerHTML = '<div class="hint">Pautan slip PDF tiada dalam rekod.</div>';
    }

    switchTab('dash');
    $('scanCard').hidden = true;
    $('result').hidden = false;
    window.scrollTo(0, 0);

    // Letupkan konfeti jika mencapai keputusan cemerlang
    if (/cemerlang|kepujian/i.test(s.status)) {
      popHeroConfetti();
    }
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === name); });
    $('dash').hidden = name !== 'dash';
    $('slipTab').hidden = name !== 'slipTab';
  }

  function resetAll() {
    $('result').hidden = true; $('scanCard').hidden = false;
    $('manual').value = ''; $('camMsg').hidden = true; busy = false;
    $('pdfBox').innerHTML = '';
    startScan($('camSelect').value);
  }

  /* ================= PENGENDALI BUTANG ================= */
  $('btnStart').onclick = function () { startScan(); };
  $('btnStop').onclick = stopScan;
  $('camSelect').onchange = function () { startScan(this.value); };
  $('btnAgain').onclick = resetAll;
  document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { switchTab(b.dataset.tab); }; });

  function manualGo() {
    var v = $('manual').value.trim();
    if (v && !busy) lookup(v);
  }
  $('btnManual').onclick = manualGo;
  $('manual').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); manualGo(); } });

  $('fileIn').addEventListener('change', async function () {
    var f = this.files && this.files[0];
    if (!f) return;
    try {
      if (running) await stopScan();
      fileQr = fileQr || new Html5Qrcode('fileReader');
      var text = await fileQr.scanFile(f, false);
      beep();
      lookup(text);
    } catch (e) {
      showCamMsg('Barcode tidak dapat dikesan daripada imej tersebut.', 'err');
    }
    this.value = '';
  });

  window.addEventListener('load', function () { $('manual').focus(); });
</script>
</body>
</html>
