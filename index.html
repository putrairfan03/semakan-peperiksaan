  <style>
    :root { --bg: #f3f5f9; --ink: #1c2433; --mut: #667085; --pri: #1d4ed8; --line: #e4e7ec; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
    header { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fff; padding: 18px 16px; text-align: center; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
    main { max-width: 760px; margin: 0 auto; padding: 14px; }
    .card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(16, 24, 40, .08); }
    
    /* Ruang Kamera Live */
    #reader-container {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      min-height: 280px; /* Pastikan ada ruang visual */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #reader {
      width: 100% !important;
      border: none !important;
    }
    #reader video {
      border-radius: 10px;
      object-fit: cover;
      width: 100% !important;
    }

    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
    .btn { border: 1px solid var(--line); background: #fff; padding: 10px 14px; border-radius: 10px; font-size: 14px; cursor: pointer; color: var(--ink); text-decoration: none; display: inline-block; }
    .btn.primary { background: var(--pri); border-color: var(--pri); color: #fff; font-weight: 600; }
    input[type=text], select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; max-width: 100%; }
    input[type=text] { flex: 1; min-width: 160px; }
    .msg { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; line-height: 1.45; }
    .msg.err { background: #fef3f2; color: #b42318; border: 1px solid #fecdca; }
    .msg.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .hint { font-size: 12px; color: var(--mut); margin-top: 8px; }
    [hidden] { display: none !important; }
