<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semakan Keputusan Peperiksaan</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { --bg: #f3f5f9; --ink: #1c2433; --mut: #667085; --pri: #1d4ed8; --line: #e4e7ec; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
    header { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fff; padding: 18px 16px; text-align: center; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
    main { max-width: 760px; margin: 0 auto; padding: 14px; }
    .card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(16, 24, 40, .08); }
    
    /* Ruang Kamera Live */
    #reader { width: 100%; min-height: 250px; border-radius: 12px; overflow: hidden; background: #111; margin-bottom: 10px; }
    #reader video { width: 100% !important; height: auto !important; border-radius: 12px; object-fit: cover; }
    
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
    .btn { border: 1px solid var(--line); background: #fff; padding: 10px 14px; border-radius: 10px; font-size: 14px; cursor: pointer; color: var(--ink); text-decoration: none; display: inline-block; font-weight: 500; }
    .btn.primary { background: var(--pri); border-color: var(--pri); color: #fff; font-weight: 600; }
    input[type=text], select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; max-width: 100%; }
    input[type=text] { flex: 1; min-width: 160px; }
    .msg { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; line-height: 1.45; }
    .msg.err { background: #fef3f2; color: #b42318; border: 1px solid #fecdca; }
    .msg.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .hint { font-size: 12px; color: var(--mut); margin-top: 8px; }
    [hidden] { display: none !important; }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tab { flex: 1; padding: 10px; border: 0; border-radius: 10px; background: #e8ecf4; font-weight: 600; cursor: pointer; font-size: 14px; }
    .tab.on { background: var(--pri); color: #fff; }
    .name { font-size: 20px; font-weight: 700; margin: 0; }
    .ic { color: var(--mut); font-size: 14px; margin: 2px 0 8px; }
    .chip { display: inline-block; padding: 4px 12px; border-radius: 99px; font-size: 13px; font-weight: 600; color: #fff; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
    .stat { background: #f8fafc; border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
    .stat b { display: block; font-size: 20px; }
    .stat span { font-size: 12px; color: var(--mut); }
    .sub { margin: 12px 0; }
    .sub .top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
    .track { position: relative; height: 10px; background: #eef1f6; border-radius: 99px; }
    .fill { height: 100%; border-radius: 99px; }
    .mark { position: absolute; top: -3px; width: 2px; height: 16px; background: #111; opacity: .5; }
    .legend { font-size: 12px; color: var(--mut); margin-top: 6px; }
    .comment { background: #f8fafc; border-left: 4px solid var(--pri); padding: 10px 12px; border-radius: 8px; font-size: 14px; line-height: 1.5; margin-top: 14px; }
    .slip { border: 2px solid #111; padding: 18px; background: #fff; }
    .slip h2 { text-align: center; margin: 0 0 14px; font-size: 18px; letter-spacing: .5px; }
    .slip table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 14px; }
    .slip td, .slip th { border: 1px solid #999; padding: 7px 9px; text-align: left; }
    .slip th { background: #eee; }
    .slip .k { width: 38%; background: #f6f6f6; font-weight: 600; }
    .pdf { width: 100%; height: 520px; border: 1px solid var(--line); border-radius: 10px; margin-top: 12px; }
    .center { text-align: center; }
    @media print {
      body * { visibility: hidden; }
      #slip, #slip * { visibility: visible; }
      #slip { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body>
<header>
  <h1>Semakan Keputusan Peperiksaan</h1>
  <p>Imbas barcode pada kad pelajar</p>
</header>

<main>
  <!-- ===== PENGIMBAS ===== -->
  <section id="scanCard" class="card">
    <div id="reader"></div>
    <div id="fileReader" hidden></div>
    <div id="camMsg" class="msg" hidden></div>

    <div class="row">
      <button id="btnStart" class="btn primary">📷 Mula Imbas Kamera Belakang</button>
      <button id="btnStop" class="btn" hidden>⏹ Henti</button>
      <select id="camSelect" hidden></select>
      <label class="btn">📁 Muat naik gambar barcode
        <input type="file" id="fileIn" accept="image/*" capture="environment" hidden>
      </label>
    </div>

    <div class="row">
      <input type="text" id="manual" placeholder="Atau taip / imbas guna scanner USB, tekan Enter" autocomplete="off">
      <button id="btnManual" class="btn">Semak</button>
    </div>
    <div class="hint">Tip: Jarak 15–20 cm dari barcode, letakkan barcode secara melintang.</div>
    <div id="loading" class="msg info" hidden>Sedang mencari rekod pelajar…</div>
  </section>

  <!-- ===== KEPUTUSAN ===== -->
  <section id="result" hidden>
    <div class="row" style="margin:0 0 12px">
      <button id="btnAgain" class="btn primary">🔄 Imbas pelajar lain</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="dash">Dashboard</button>
      <button class="tab" data-tab="slipTab">Slip Peperiksaan</button>
    </div>

    <div id="dash" class="card"></div>

    <div id="slipTab" hidden>
      <div class="card">
        <div id="slip" class="slip"></div>
        <div class="row">
          <button class="btn primary" onclick="window.print()">🖨 Cetak slip</button>
          <a id="lnkView" class="btn" target="_blank" rel="noopener">Buka PDF</a>
          <a id="lnkDl" class="btn" target="_blank" rel="noopener">⬇ Muat turun PDF</a>
        </div>
        <div id="pdfBox"></div>
      </div>
    </div>
  </section>
</main>

<script>
  var API_URL = 'https://script.google.com/macros/s/AKfycbz8DqnK0w03nqC341Q_sAbAyXzAP0r9vBuoLRZ8Ib4mis2FrXKLvcv7Xx065aRytWD3/exec';

  var $ = function (id) { return document.getElementById(id); };
  var GP = { 'A+': 0, 'A': 1, 'A-': 2, 'B+': 3, 'B': 4, 'C+': 5, 'C': 6, 'D': 7, 'E': 8, 'F': 9 };
  var STATUS_COLOR = {
    'Cemerlang': '#16a34a', 'Kepujian': '#2563eb', 'Memuaskan': '#d97706',
    'Mencapai Tahap Minimum': '#ea580c', 'Perlu Bimbingan': '#dc2626'
  };
  var html5QrCode = null, fileQr = null, running = false, busy = false;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function gradeColor(p) { return p <= 1 ? '#16a34a' : p <= 3 ? '#2563eb' : p <= 5 ? '#f59e0b' : p <= 7 ? '#f97316' : '#dc2626'; }

  function beep() {
    try {
      var c = new (window.AudioContext || window.webkitAudioContext)();
      var o = c.createOscillator(); o.type = 'square'; o.frequency.value = 1000;
      o.connect(c.destination); o.start();
      setTimeout(function () { o.stop(); c.close(); }, 120);
    } catch (e) {}
  }

  function showCamMsg(html, type) {
    var m = $('camMsg'); m.className = 'msg ' + (type || 'err'); m.innerHTML = html; m.hidden = false;
  }

  /* ================= PENGIMBAS KAMERA ================= */
  async function startScan(targetDeviceId) {
    if (typeof Html5Qrcode === 'undefined') {
      showCamMsg('Pustaka pengimbas belum sedia. Sila muat semula halaman.', 'err');
      return;
    }
    $('camMsg').hidden = true;
    if (running) await stopScan();

    try {
      if (!html5QrCode) {
        // Matikan BarCodeDetector bawaan pelayar bagi mengelakkan pepijat skrin hitam Chrome
        html5QrCode = new Html5Qrcode('reader', {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.QR_CODE,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8
          ],
          verbose: false
        });
      }

      // Senaraikan kamera dan utamakan kamera belakang
      var devices = await Html5Qrcode.getCameras();
      var chosenId = targetDeviceId;

      if (devices && devices.length > 0) {
        var sel = $('camSelect');
        sel.innerHTML = devices.map(function (c, i) {
          return '<option value="' + esc(c.id) + '">' + esc(c.label || ('Kamera ' + (i + 1))) + '</option>';
        }).join('');
        sel.hidden = devices.length < 2;

        if (!chosenId) {
          // Cari kamera belakang secara pintar melalui label
          var backCam = devices.find(function (d) {
            return /back|rear|environment|belakang/i.test(d.label);
          });
          chosenId = backCam ? backCam.id : devices[devices.length - 1].id;
        }
        sel.value = chosenId;
      }

      var cameraConfig = chosenId ? { deviceId: { exact: chosenId } } : { facingMode: "environment" };

      var config = {
        fps: 15,
        qrbox: function (viewfinderWidth, viewfinderHeight) {
          var width = Math.floor(Math.min(viewfinderWidth * 0.85, 360));
          var height = Math.floor(Math.min(viewfinderHeight * 0.45, 180));
          return { width: width, height: height };
        }
      };

      await html5QrCode.start(cameraConfig, config, onScan, function () {});
      running = true;
      $('btnStart').hidden = true;
      $('btnStop').hidden = false;
    } catch (err) {
      running = false;
      showCamMsg('<b>Kamera gagal dibuka:</b> ' + esc(err.message || err) + '<br>Pastikan kebenaran kamera dibenarkan atau cuba tukar pilihan kamera di menu dropdown.', 'err');
    }
  }

  async function stopScan() {
    if (html5QrCode && running) {
      try { await html5QrCode.stop(); } catch (e) {}
    }
    running = false;
    $('btnStart').hidden = false;
    $('btnStop').hidden = true;
  }

  function onScan(decodedText) {
    if (busy) return;
    busy = true;
    beep();
    stopScan().then(function () { lookup(decodedText); });
  }

  /* ================= CARIAN API ================= */
  async function lookup(code) {
    busy = true;
    $('loading').hidden = false; $('camMsg').hidden = true;
    
    try {
      var targetUrl = API_URL + '?code=' + encodeURIComponent(code);
      var response = await fetch(targetUrl);
      var res = await response.json();
      
      $('loading').hidden = true;
      busy = false;

      if (!res || !res.ok) {
        showCamMsg(esc((res && res.message) || 'Rekod pelajar tidak dijumpai.'), 'err');
        return;
      }
      render(res.student);
    } catch (err) {
      $('loading').hidden = true;
      busy = false;
      showCamMsg('Ralat sambungan: ' + esc(err.message || err), 'err');
    }
  }

  /* ================= PAPARAN KEPUTUSAN ================= */
  function render(s) {
    var color = STATUS_COLOR[s.status] || '#475467';

    var bars = s.subjects.map(function (x) {
      var p = GP[x.grade.toUpperCase()];
      var known = p !== undefined;
      var w = known ? Math.max(6, ((9 - p) / 9) * 100) : 0;
      var avg = s.classAvg[x.name];
      var mark = avg == null ? '' : '<div class="mark" style="left:' + (((9 - avg) / 9) * 100) + '%"></div>';
      return '<div class="sub"><div class="top"><span>' + esc(x.name) + '</span><b>' + esc(x.grade) + '</b></div>' +
             '<div class="track"><div class="fill" style="width:' + w + '%;background:' + (known ? gradeColor(p) : '#999') + '"></div>' + mark + '</div></div>';
    }).join('');

    $('dash').innerHTML =
      '<p class="name">' + esc(s.nama) + '</p>' +
      '<p class="ic">' + esc(s.ic) + '</p>' +
      '<span class="chip" style="background:' + color + '">' + esc(s.status) + '</span>' +
      '<div class="stats">' +
        '<div class="stat"><b>' + esc(s.kedudukan) + ' / ' + esc(s.total) + '</b><span>Kedudukan</span></div>' +
        '<div class="stat"><b>' + esc(s.purata) + '</b><span>Gred Purata</span></div>' +
        '<div class="stat"><b>' + esc(s.subjects.length) + '</b><span>Subjek</span></div>' +
      '</div>' +
      bars +
      '<div class="legend">Panjang bar = markah pelajar. Garis tegak = purata kelas.</div>' +
      '<div class="comment">' + esc(s.ulasan) + '</div>';

    var rows = s.subjects.map(function (x) {
      return '<tr><td>' + esc(x.name) + '</td><td><b>' + esc(x.grade) + '</b></td></tr>';
    }).join('');

    $('slip').innerHTML =
      '<h2>SLIP KEPUTUSAN PEPERIKSAAN</h2>' +
      '<table>' +
        '<tr><td class="k">Nama</td><td>' + esc(s.nama) + '</td></tr>' +
        '<tr><td class="k">No. Kad Pengenalan</td><td>' + esc(s.ic) + '</td></tr>' +
        '<tr><td class="k">Kedudukan</td><td>' + esc(s.kedudukan) + ' daripada ' + esc(s.total) + ' pelajar</td></tr>' +
        '<tr><td class="k">Gred Purata</td><td>' + esc(s.purata) + '</td></tr>' +
        '<tr><td class="k">Status</td><td>' + esc(s.status) + '</td></tr>' +
      '</table>' +
      '<table><tr><th>Subjek</th><th>Gred</th></tr>' + rows + '</table>' +
      '<p style="font-size:13px"><b>Ulasan:</b> ' + esc(s.ulasan) + '</p>' +
      '<p style="font-size:11px;color:#666;margin:8px 0 0">Dicetak pada ' + new Date().toLocaleString('ms-MY') + '</p>';

    if (s.slip) {
      $('lnkView').href = s.slip.viewUrl; $('lnkView').hidden = false;
      $('lnkDl').href = s.slip.downloadUrl; $('lnkDl').hidden = false;
      $('pdfBox').innerHTML = '<iframe class="pdf" src="' + esc(s.slip.previewUrl) + '"></iframe>' +
        '<div class="hint">Jika PDF tidak muncul, pastikan tetapan fail Google Drive adalah "Anyone with the link – Viewer".</div>';
    } else {
      $('lnkView').hidden = true; $('lnkDl').hidden = true;
      $('pdfBox').innerHTML = '<div class="hint">Pautan slip PDF tiada dalam sheet.</div>';
    }

    switchTab('dash');
    $('scanCard').hidden = true;
    $('result').hidden = false;
    window.scrollTo(0, 0);
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === name); });
    $('dash').hidden = name !== 'dash';
    $('slipTab').hidden = name !== 'slipTab';
  }

  function resetAll() {
    $('result').hidden = true; $('scanCard').hidden = false;
    $('manual').value = ''; $('camMsg').hidden = true; busy = false;
    $('pdfBox').innerHTML = '';
    startScan($('camSelect').value);
  }

  /* ================= BUTANG & EVENT ================= */
  $('btnStart').onclick = function () { startScan(); };
  $('btnStop').onclick = stopScan;
  $('camSelect').onchange = function () { startScan(this.value); };
  $('btnAgain').onclick = resetAll;
  document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { switchTab(b.dataset.tab); }; });

  function manualGo() {
    var v = $('manual').value.trim();
    if (v && !busy) lookup(v);
  }
  $('btnManual').onclick = manualGo;
  $('manual').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); manualGo(); } });

  $('fileIn').addEventListener('change', async function () {
    var f = this.files && this.files[0];
    if (!f) return;
    try {
      if (running) await stopScan();
      fileQr = fileQr || new Html5Qrcode('fileReader');
      var text = await fileQr.scanFile(f, false);
      beep();
      lookup(text);
    } catch (e) {
      showCamMsg('Barcode tidak dapat dibaca daripada gambar. Sila pastikan foto dekat dan tajam.', 'err');
    }
    this.value = '';
  });

  window.addEventListener('load', function () { $('manual').focus(); });
</script>
</body>
</html>
